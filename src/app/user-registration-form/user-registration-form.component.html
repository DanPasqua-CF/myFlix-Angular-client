<mat-card>
  <mat-card-header>
    <mat-card-title>Sign Up!</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <form>

      <!-- Username input -->
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userData.username"
          placeholder="Username"
          type="text"
          name="Username"
          required
        >  
        </mat-form-field>
        
        <!-- Password input -->
        <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.password"
            type = "password"
            placeholder="Password"
            name="Password"
            required
          >
        </mat-form-field>
        
        <!-- Email input -->
        <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.email"
            type = "email"
            placeholder="Email"
            name="Email"
            required
          >
        </mat-form-field>
        
        <!-- Birthday input -->
        <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.birthday"
            type = "date"
            placeholder="Birthday"  
            name="Birthday"
          >
        </mat-form-field>
      </form>
    </mat-card-content>
    
    <mat-card-actions>
        <button
          mat-raised-button
          (click)="registerUser()"
          color="primary"
        >
          Sign Up
        </button>
    </mat-card-actions>
  </mat-card>
