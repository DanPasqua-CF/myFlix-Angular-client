<div class="main-page">
  <h1>
    Welcome to myFlix!
  </h1>

  <!-- Sign up button -->
  <button
    mat-raised-button
    (click)="openUserRegistrationDialog()"
    style="margin-right: 10px;"
    color="primary"
  >
    Sign up
  </button>

  <!-- Log in button -->
  <button
    mat-raised-button
    color="primary"
    (click)="openUserLoginDialog()"
    style="margin-right: 10px;"
  >
    Log in
  </button>
</div>
