<mat-card>
  <mat-card-header>
    <mat-card-title>Log in</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <form>
      <!-- Username input -->
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userData.username"
          placeholder="Username"
          type="text"
          name="Username"
          required
        >  
        </mat-form-field>

        <!-- Password input -->
        <mat-form-field>
          <input
            matInput
            [(ngModel)]="userData.password"
            type = "password"
            placeholder="Password"
            name="Password"
            required
          >
        </mat-form-field>
        
      </form>
    </mat-card-content>
    
    <mat-card-actions>
        <button
          mat-raised-button
          (click)="userLogin()"
          color="primary"
        >
          Log In
        </button>
    </mat-card-actions>
  </mat-card>
